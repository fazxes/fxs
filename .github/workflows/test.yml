name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python3 -m py_compile fxs
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax check
        run: sh -n install.sh
